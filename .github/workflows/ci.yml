name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一個 PR 推了新的 commit，舊的就不用跑完；main 的每個 commit 都要有結果
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # h1v1 的工具鏈只有課程有，不能公開，交叉編譯和 qemu 還是在本機跑
  test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [pc-debug, pc-release]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Check the default config
        run: build/${{ matrix.preset }}/dev_board config/dev_board.json
